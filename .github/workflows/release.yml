name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            artifact: warp-minimal
          - goos: windows
            goarch: arm64
            ext: .exe
            artifact: warp-minimal
          - goos: linux
            goarch: amd64
            ext: ""
            artifact: warp-minimal
          - goos: linux
            goarch: arm64
            ext: ""
            artifact: warp-minimal
          - goos: darwin
            goarch: amd64
            ext: ""
            artifact: warp-minimal
          - goos: darwin
            goarch: arm64
            ext: ""
            artifact: warp-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="warp-minimal${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$out" ./cmd/warp-minimal
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${{ matrix.artifact }}_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "$out"
          else
            tar -czf "${{ matrix.artifact }}_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "$out"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            warp-minimal_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            warp-minimal_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create registry.json
        run: |
          cd artifacts
          cat > registry.json <<REG
          {
            "version": "${{ github.ref_name }}",
            "packages": [
              {
                "id": "warp-minimal",
                "version": "${{ github.ref_name }}",
                "platforms": {
                  "windows_amd64": "warp-minimal_${{ github.ref_name }}_windows_amd64.zip",
                  "windows_arm64": "warp-minimal_${{ github.ref_name }}_windows_arm64.zip",
                  "linux_amd64": "warp-minimal_${{ github.ref_name }}_linux_amd64.tar.gz",
                  "linux_arm64": "warp-minimal_${{ github.ref_name }}_linux_arm64.tar.gz",
                  "darwin_amd64": "warp-minimal_${{ github.ref_name }}_darwin_amd64.tar.gz",
                  "darwin_arm64": "warp-minimal_${{ github.ref_name }}_darwin_arm64.tar.gz"
                }
              }
            ]
          }
          REG
          cat registry.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/checksums.txt
            artifacts/registry.json
          generate_release_notes: true
